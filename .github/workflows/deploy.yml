# GitHub Actions — CI/CD for The Analyst Copilot
# Runs tests, builds Docker images, pushes to ACR, deploys to Azure App Service.
#
# Required GitHub Secrets:
#   AZURE_CLIENT_ID       - Service principal client ID
#   AZURE_TENANT_ID       - Azure tenant ID
#   AZURE_SUBSCRIPTION_ID - Azure subscription ID
#   ACR_LOGIN_SERVER      - e.g. acopilotprodacr.azurecr.io
#   ACR_USERNAME          - ACR admin username
#   ACR_PASSWORD          - ACR admin password
#   AZURE_BACKEND_APP     - App Service name, e.g. acopilot-prod-api
#   AZURE_RG              - Resource group name, e.g. acopilot-prod-rg
#   VITE_API_BASE         - Backend URL for frontend build, e.g. https://acopilot-prod-api.azurewebsites.net
#   SWA_DEPLOYMENT_TOKEN  - Azure Static Web App deployment token

name: Build & Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short

  build-and-deploy:
    name: Build & Deploy to Azure
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/acopilot-backend:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/acopilot-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE=${{ secrets.VITE_API_BASE }}
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/acopilot-frontend:latest

      - name: Deploy backend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_BACKEND_APP }}
          resource-group-name: ${{ secrets.AZURE_RG }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/acopilot-backend:${{ github.sha }}

      - name: Build React frontend
        run: |
          cd frontend
          npm ci
          VITE_API_BASE="${{ secrets.VITE_API_BASE }}" npm run build

      - name: Deploy frontend to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true

      - name: Health check
        run: |
          sleep 20
          curl -sf "${{ secrets.VITE_API_BASE }}/health" || echo "Health check failed — check logs"

      - name: Azure logout
        if: always()
        run: az logout
